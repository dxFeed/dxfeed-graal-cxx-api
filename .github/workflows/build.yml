name: CI

# A pull request runs the short set: the `pullRequest` rows of .github/ci/build-matrix.json and the other jobs except
# the network tests. The full matrix runs on a push to main or release/*, nightly, on a manual run, and on a pull
# request with the `full-ci` label (adding the label starts it).
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  push:
    branches: [ main, 'release/**' ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer run of a pull request (a push, the full-ci label) cancels the older one; a run started by another label does
# nothing and has its own group, so that it cancels nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && 'other-label' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The short set of the pull requests or the full matrix, both from .github/ci/build-matrix.json.
  plan:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      build: ${{ steps.plan.outputs.build }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci

      - name: Select the matrix
        id: plan
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          build=$(python3 .github/ci/build_matrix.py "$([ "$FULL" = true ] && echo full || echo pr)")
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}

    name: "${{ matrix.config.name }}-${{matrix.buildType}}-${{matrix.sanitizers}}"
    runs-on: ${{ matrix.config.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode version
        if: ${{ contains(matrix.config.os, 'macos') }}
        run: sudo xcode-select -s '/Applications/Xcode_${{matrix.config.xcode}}.app/Contents/Developer'

      - name: Prepare build
        run: |
          ls
          mkdir ${{github.workspace}}/build

      - name: Prepare build (Win MT)
        if: ${{ contains(matrix.config.os, 'win') }}
        run: |
          ls
          mkdir ${{github.workspace}}/build-mt   

      - name: Install clang from LLVM apt repo
        if: ${{ matrix.config.llvm_version != '' && matrix.config.llvm_version != null }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.config.llvm_version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${{ matrix.config.llvm_version }}
          
      - name: Install gcc from ubuntu-toolchain-r PPA
        if: ${{ matrix.config.gcc_version != '' && matrix.config.gcc_version != null }}
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.config.gcc_version }} g++-${{ matrix.config.gcc_version }}

      - name: Install Linux UI dependencies
        if: ${{ contains(matrix.config.os, 'linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev

      - name: Configure CMake
        if: ${{ contains(matrix.config.os, 'mac') }}
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DDXFCXX_PACKAGE_SUFFIX=-${{matrix.buildType}}
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_FEATURE_STACKTRACE=ON
          -DDXFCXX_ENABLE_${{matrix.sanitizers}}=ON

      - name: Configure CMake
        if: ${{ contains(matrix.config.os, 'linux') }}
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DDXFCXX_PACKAGE_SUFFIX=-${{matrix.buildType}}
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_FEATURE_STACKTRACE=ON
          -DDXFCXX_ENABLE_${{matrix.sanitizers}}=ON

      - name: Configure CMake
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DDXFCXX_PACKAGE_SUFFIX=-${{matrix.buildType}}
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_FEATURE_STACKTRACE=ON
          -DDXFCXX_ENABLE_${{matrix.sanitizers}}=ON

      - name: Configure CMake (Win MT)
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake -B ${{github.workspace}}/build-mt
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DDXFCXX_PACKAGE_SUFFIX=-${{matrix.buildType}}-static-mt
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_FEATURE_STACKTRACE=ON
          -DDXFCXX_LINK_STATIC_RUNTIME=ON

      - name: Build
        if: ${{ !contains(matrix.config.os, 'win') }}
        run: >
          cmake --build ${{github.workspace}}/build --config ${{matrix.buildType}} -j ${{matrix.config.cores}}

      - name: Build
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake --build ${{github.workspace}}/build --config ${{matrix.buildType}} -j ${{matrix.config.cores}}
          --
          /p:CL_MPCount=${{matrix.config.cores}}

      - name: Build (Win MT)
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake --build ${{github.workspace}}/build-mt --config ${{matrix.buildType}} -j ${{matrix.config.cores}}
          --
          /p:CL_MPCount=${{matrix.config.cores}}          

      - name: Pack artifacts
        if: ${{ matrix.buildType == 'Release' && matrix.sanitizers == 'NO_SAN' }}
        working-directory: ${{github.workspace}}/build
        run: cpack -G ${{ contains(matrix.config.os, 'win') && 'ZIP' || 'TGZ' }} -C ${{matrix.buildType}} --config ./dxFeedGraalCxxApiPackConfig.cmake

      - name: Pack artifacts (Win MT)
        if: ${{ contains(matrix.config.os, 'win') && matrix.buildType == 'Release' && matrix.sanitizers == 'NO_SAN' }}
        working-directory: ${{github.workspace}}/build-mt
        run: cpack -G ZIP -C ${{matrix.buildType}} --config ./dxFeedGraalCxxApiPackConfig.cmake

      - name: Upload artifacts
        if: ${{ matrix.buildType == 'Release' && matrix.sanitizers == 'NO_SAN' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.config.name }}-${{matrix.buildType}}-${{matrix.sanitizers}}
          path: |
            build/*.zip
            build/*.tar.gz
            build-mt/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.buildType}} --extra-verbose --output-on-failure --parallel ${{matrix.config.cores}}

  release-script:
    needs: plan
    name: "release-script-tests"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # release.py, release.cmake (in a git repository) and their agreement
      - name: Test scripts/release.py and scripts/release.cmake
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test the functions of scripts/release.cmake
        run: cmake -P scripts/tests/test_release.cmake

  tsan:
    needs: plan
    name: "ubuntu-24.04-clang-18-RelWithDebInfo-TSAN"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ThreadSanitizer of clang 18 cannot map its shadow memory with the default ASLR entropy of the runner kernel.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build -j 4

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --extra-verbose --output-on-failure --parallel 4

  # Every public header must compile on its own, and the whole project must build without precompiled headers.
  headers:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: win2022-vs2022
            image: windows-2022
            os: windows
            cc: 'cl'
            cxx: 'cl'
          - name: ubuntu-24.04-clang-18
            image: ubuntu-24.04
            os: linux
            cc: 'clang-18'
            cxx: 'clang++-18'
          - name: ubuntu-24.04-gcc-14
            image: ubuntu-24.04
            os: linux
            cc: 'gcc-14'
            cxx: 'g++-14'
          - name: macos-15-xcode-16-4
            image: macos-15
            os: macos
            xcode: '16.4'
            cc: 'clang'
            cxx: 'clang++'

    name: "${{ matrix.config.name }}-Debug-headers-no-pch"
    runs-on: ${{ matrix.config.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode version
        if: ${{ contains(matrix.config.os, 'macos') }}
        run: sudo xcode-select -s '/Applications/Xcode_${{matrix.config.xcode}}.app/Contents/Developer'

      # Only the Wayland backend of the UI samples here (the build matrix has both X11 and Wayland), so that the
      # Wayland-only configuration is built as well.
      - name: Install Linux UI dependencies (Wayland only)
        if: ${{ contains(matrix.config.os, 'linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Debug
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_USE_PRECOMPILED_HEADERS=OFF
          -DDXFCXX_BUILD_HEADER_CHECK=ON

      - name: Check that public headers are self-contained
        run: cmake --build ${{github.workspace}}/build --config Debug --target dxfcxx_header_check -j 4

      - name: Build without precompiled headers
        run: cmake --build ${{github.workspace}}/build --config Debug -j 4

  # Smoke tests against demo.dxfeed.com (CTest label "network"). They depend on an external service, so a failure
  # does not fail the workflow; the other unit tests do not use external network.
  network-tests:
    needs: plan
    if: ${{ needs.plan.outputs.full == 'true' }}
    name: "ubuntu-24.04-clang-18-Release-network-tests"
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Release
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_ENABLE_NETWORK_TESTS=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build -j 4 --target dxFeedGraalCxxApi_network_NetworkTest

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -L network --extra-verbose --output-on-failure

  # Unit tests linked against the shared library. On Windows they are expected to fail until the DLL-boundary defects
  # are fixed: today most test executables do not link because StringLike is not exported, and entities registered
  # from inline/template code land in a separate registry per module. Linux and macOS pass; see MDAPI-427.
  dynamic-link-tests:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: win2022-vs2022
            image: windows-2022
            os: windows
            cc: 'cl'
            cxx: 'cl'
          - name: ubuntu-24.04-clang-18
            image: ubuntu-24.04
            os: linux
            cc: 'clang-18'
            cxx: 'clang++-18'
          - name: macos-15-xcode-16-4
            image: macos-15
            os: macos
            xcode: '16.4'
            cc: 'clang'
            cxx: 'clang++'

    name: "${{ matrix.config.name }}-Release-dynamic-link-tests"
    runs-on: ${{ matrix.config.image }}
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode version
        if: ${{ contains(matrix.config.os, 'macos') }}
        run: sudo xcode-select -s '/Applications/Xcode_${{matrix.config.xcode}}.app/Contents/Developer'

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=Release
          -DDXFCXX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_DYNAMICALLY_LINK_UNIT_TESTS=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release -j 4

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C Release --extra-verbose --output-on-failure --parallel 4
