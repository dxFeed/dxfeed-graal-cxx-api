name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish The Release'
        default: true
        required: true
        type: boolean
      use_latest_tag:
        description: 'Try To Use The Latest Git Tag'
        default: false
        required: true
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  get_version:
    name: Get Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag_name: ${{ steps.set_version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          fetch-tags: 'true'
          fetch-depth: '0'
          show-progress: 'true'
      - id: get_latest_tag
        run: |
          echo "tag=$(git describe --abbrev=0 --tags)" >> $GITHUB_OUTPUT

      - id: set_version
        run: |
          if [[ "${{ !inputs.use_latest_tag && startsWith(github.ref, 'refs/tags/') }}" == "true" ]]
          then
            echo "version=${{github.ref_name}}" >> $GITHUB_OUTPUT
            echo "tag_name=${{github.ref}}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.get_latest_tag.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "tag_name=${{ format('refs/tags/{0}', steps.get_latest_tag.outputs.tag) }}" >> $GITHUB_OUTPUT            
          fi

      # The text of the GitHub release: the section of the version in ReleaseNotes.md of the tag (a draft: the unreleased
      # items, with those of release-notes/). A release without its section fails here, before the packages are built.
      - name: Release notes
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
          TAG: ${{ steps.set_version.outputs.tag_name }}
        run: |
          python3 scripts/release.py --notes "$VERSION" --ref "$TAG" > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build_package_and_upload:
    name: "${{ matrix.config.name }}-${{matrix.buildType}}: Build, Package & Upload"
    needs: [ get_version ]
    strategy:
      matrix:
        config:
          - name: win-vs2022
            # VS 2022 17.14: the static libraries of the archives link with MSVC 14.44 (VS 2022 17.14) and newer.
            image: windows-2022
            os: windows
            cores: 4
            cc: 'cl'
            cxx: 'cl'
          - name: macos-15-intel-xcode-16-4
            image: macos-15-intel
            os: macos
            cores: 4
            xcode: '16.4'
            cc: 'clang'
            cxx: 'clang++'
          # Linux: Oracle Linux 8 (glibc 2.28) with GCC Toolset 14. The packages need glibc 2.28 and the libstdc++ of
          # GCC 8; the toolset links the newer parts of libstdc++ statically.
          - name: oraclelinux-8-gcc-toolset-14
            image: ubuntu-24.04
            container: oraclelinux:8
            os: linux
            cores: 4
            cc: 'gcc'
            cxx: 'g++'
          - name: oraclelinux-8-arm-gcc-toolset-14
            image: ubuntu-24.04-arm
            container: oraclelinux:8
            os: linux
            cores: 4
            cc: 'gcc'
            cxx: 'g++'
          - name: macos-15-xcode-16-4
            image: macos-15
            os: macos
            cores: 3
            xcode: '16.4'
            cc: 'clang'
            cxx: 'clang++'
        buildType: [ Release, Debug, RelWithDebInfo ]
    runs-on: ${{ matrix.config.image }}
    # Empty for Windows and macOS: the job runs on the runner. In a container, ${{github.workspace}} is the path on the
    # runner, not in the container, so the steps use paths relative to the workspace.
    container: ${{ matrix.config.container }}
    timeout-minutes: 90

    steps:
      # Before the checkout: git for it and for the dependencies that CMake fetches.
      - name: Install Linux build dependencies
        if: ${{ contains(matrix.config.os, 'linux') }}
        timeout-minutes: 15
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled ol8_codeready_builder
          dnf -y install gcc-toolset-14-gcc-c++ gcc-toolset-14-binutils cmake git make unzip
          echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.get_version.outputs.tag_name}}

      - name: Select Xcode version
        if: ${{ contains(matrix.config.os, 'macos') }}
        run: sudo xcode-select -s '/Applications/Xcode_${{matrix.config.xcode}}.app/Contents/Developer'

      - name: Install Linux UI dependencies
        if: ${{ contains(matrix.config.os, 'linux') && !contains(matrix.buildType, 'Deb') }}
        timeout-minutes: 10
        run: >
          dnf -y install mesa-libGL-devel libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel
          libXext-devel wayland-devel libxkbcommon-devel

      - name: Prepare build [Lib]
        run: |
          ls
          mkdir build-${{matrix.buildType}}

      - name: Prepare build [Lib][Win with static with MT]
        if: ${{ contains(matrix.config.os, 'win') }}
        run: |
          ls
          mkdir build-${{matrix.buildType}}-mt

      - name: Prepare build [Samples][Tools]
        if: ${{ !contains(matrix.buildType, 'Deb') }}
        run: |
          ls
          mkdir build-Samples          
          mkdir build-Tools          

      - name: Configure CMake [Lib]
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake -B build-${{matrix.buildType}}
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_VERSION="${{needs.get_version.outputs.version}}"
          -DDXFCXX_PACKAGE_SUFFIX="-${{matrix.buildType}}"
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_INSTALL_SAMPLES=OFF
          -DDXFCXX_INSTALL_TOOLS=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_FEATURE_STACKTRACE=ON

      - name: Configure CMake [Lib][Win with static with MT]
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake -B build-${{matrix.buildType}}-mt
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_VERSION="${{needs.get_version.outputs.version}}"
          -DDXFCXX_PACKAGE_SUFFIX="-${{matrix.buildType}}-static-mt"
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_INSTALL_SAMPLES=OFF
          -DDXFCXX_INSTALL_TOOLS=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_FEATURE_STACKTRACE=ON
          -DDXFCXX_LINK_STATIC_RUNTIME=ON

      - name: Configure CMake [Samples][Tools]
        if: ${{ contains(matrix.config.os, 'windows') && !contains(matrix.buildType, 'Deb') }}
        run: >
          cmake -B build-Samples
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_VERSION="${{needs.get_version.outputs.version}}"
          -DDXFCXX_PACKAGE_SUFFIX="-Samples"
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_INSTALL_LIB=OFF
          -DDXFCXX_INSTALL_TOOLS=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_FEATURE_STACKTRACE=ON

          cmake -B build-Tools
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DDXFCXX_VERSION="${{needs.get_version.outputs.version}}"
          -DDXFCXX_PACKAGE_SUFFIX="-Tools"
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_INSTALL_LIB=OFF
          -DDXFCXX_INSTALL_SAMPLES=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_FEATURE_STACKTRACE=ON

      - name: Configure CMake [Lib]
        if: ${{ contains(matrix.config.os, 'macos') }}
        run: >
          cmake -B build-${{matrix.buildType}}
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DDXFCXX_VERSION=${{needs.get_version.outputs.version}}
          -DDXFCXX_PACKAGE_SUFFIX=-${{matrix.buildType}}
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_INSTALL_SAMPLES=OFF
          -DDXFCXX_INSTALL_TOOLS=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_FEATURE_STACKTRACE=ON

      - name: Configure CMake [Samples][Tools]
        if: ${{ contains(matrix.config.os, 'macos') && !contains(matrix.buildType, 'Deb') }}
        run: >
          cmake -B build-Samples
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DDXFCXX_VERSION=${{needs.get_version.outputs.version}}
          -DDXFCXX_PACKAGE_SUFFIX=-Samples
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_INSTALL_LIB=OFF
          -DDXFCXX_INSTALL_TOOLS=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_FEATURE_STACKTRACE=ON

          cmake -B build-Tools
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DDXFCXX_VERSION=${{needs.get_version.outputs.version}}
          -DDXFCXX_PACKAGE_SUFFIX=-Tools
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_INSTALL_LIB=OFF
          -DDXFCXX_INSTALL_SAMPLES=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_FEATURE_STACKTRACE=ON

      # CMAKE_INSTALL_LIBDIR: GNUInstallDirs picks lib64 on Oracle Linux; the packages keep lib/, as on the other
      # systems.
      - name: Configure CMake [Lib]
        if: ${{ contains(matrix.config.os, 'linux') }}
        run: >
          cmake -B build-${{matrix.buildType}}
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DCMAKE_INSTALL_LIBDIR=lib
          -DDXFCXX_VERSION=${{needs.get_version.outputs.version}}
          -DDXFCXX_PACKAGE_SUFFIX=-${{matrix.buildType}}
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_INSTALL_SAMPLES=OFF
          -DDXFCXX_INSTALL_TOOLS=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_FEATURE_STACKTRACE=ON

      - name: Configure CMake [Samples][Tools]
        if: ${{ contains(matrix.config.os, 'linux') && !contains(matrix.buildType, 'Deb') }}
        run: >
          cmake -B build-Samples
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DCMAKE_INSTALL_LIBDIR=lib
          -DDXFCXX_VERSION=${{needs.get_version.outputs.version}}
          -DDXFCXX_PACKAGE_SUFFIX=-Samples
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_TOOLS=OFF
          -DDXFCXX_INSTALL_LIB=OFF
          -DDXFCXX_INSTALL_TOOLS=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_BUILD_UI_SAMPLES=ON
          -DDXFCXX_FEATURE_STACKTRACE=ON

          cmake -B build-Tools
          -DCMAKE_BUILD_TYPE=${{matrix.buildType}}
          -DCMAKE_C_COMPILER=${{matrix.config.cc}}
          -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}}
          -DCMAKE_INSTALL_LIBDIR=lib
          -DDXFCXX_VERSION=${{needs.get_version.outputs.version}}
          -DDXFCXX_PACKAGE_SUFFIX=-Tools
          -DDXFCXX_BUILD_UNIT_TESTS=OFF
          -DDXFCXX_BUILD_SAMPLES=OFF
          -DDXFCXX_INSTALL_LIB=OFF
          -DDXFCXX_INSTALL_SAMPLES=OFF
          -DDXFCXX_BUILD_DOC=OFF
          -DDXFCXX_FEATURE_STACKTRACE=ON

      - name: Build [Lib]
        if: ${{ !contains(matrix.config.os, 'win') }}
        run: >
          cmake --build build-${{matrix.buildType}}
          --config ${{matrix.buildType}} -j ${{matrix.config.cores}}

      - name: Build [Lib]
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake --build build-${{matrix.buildType}}
          --config ${{matrix.buildType}} -j ${{matrix.config.cores}}
          --
          /p:CL_MPCount=${{matrix.config.cores}}

      - name: Build [Lib][Win with static with MT]
        if: ${{ contains(matrix.config.os, 'win') }}
        run: >
          cmake --build build-${{matrix.buildType}}-mt
          --config ${{matrix.buildType}} -j ${{matrix.config.cores}}
          --
          /p:CL_MPCount=${{matrix.config.cores}}

      - name: Build [Samples][Tools]
        if: ${{ !contains(matrix.buildType, 'Deb') && !contains(matrix.config.os, 'win') }}
        run: |
          cmake --build build-Samples --config ${{matrix.buildType}} -j ${{matrix.config.cores}}
          cmake --build build-Tools --config ${{matrix.buildType}} -j ${{matrix.config.cores}}

      - name: Build [Samples][Tools]
        if: ${{ !contains(matrix.buildType, 'Deb') && contains(matrix.config.os, 'win') }}
        run: >
          cmake --build build-Samples
          --config ${{matrix.buildType}}
          -j ${{matrix.config.cores}}
          --
          /p:CL_MPCount=${{matrix.config.cores}}

          cmake --build build-Tools
          --config ${{matrix.buildType}}
          -j ${{matrix.config.cores}}
          --
          /p:CL_MPCount=${{matrix.config.cores}}

      - name: Pack [Lib]
        working-directory: "build-${{matrix.buildType}}"
        run: cpack -G ZIP -C ${{matrix.buildType}} --config ./dxFeedGraalCxxApiPackConfig.cmake

      - name: Pack [Lib][Win with static with MT]
        if: ${{ contains(matrix.config.os, 'win') }}
        working-directory: "build-${{matrix.buildType}}-mt"
        run: cpack -G ZIP -C ${{matrix.buildType}} --config ./dxFeedGraalCxxApiPackConfig.cmake

      - name: Pack [Samples]
        if: ${{ !contains(matrix.buildType, 'Deb') }}
        working-directory: build-Samples
        run: cpack -G ${{ contains(matrix.config.os, 'win') && 'ZIP' || 'TGZ' }} -C ${{matrix.buildType}} --config ./dxFeedGraalCxxApiPackConfig.cmake

      - name: Pack [Tools]
        if: ${{ !contains(matrix.buildType, 'Deb') }}
        working-directory: build-Tools
        run: cpack -G ${{ contains(matrix.config.os, 'win') && 'ZIP' || 'TGZ' }} -C ${{matrix.buildType}} --config ./dxFeedGraalCxxApiPackConfig.cmake

      - name: Upload [Lib]
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-lib-${{matrix.config.name}}-${{matrix.buildType}}
          path: build-${{matrix.buildType}}/*.zip

      - name: Upload [Lib][Win with static with MT]
        if: ${{ contains(matrix.config.os, 'win') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-lib-${{matrix.config.name}}-${{matrix.buildType}}-mt
          path: build-${{matrix.buildType}}-mt/*.zip

      - name: Upload [Samples][Tools]
        if: ${{ !contains(matrix.buildType, 'Deb') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-samples-and-tools-${{matrix.config.name}}-${{matrix.buildType}}
          path: |
            build-Samples/*.zip
            build-Samples/*.tar.gz
            build-Tools/*.zip
            build-Tools/*.tar.gz
          if-no-files-found: error

  build_docs_and_upload_and_deploy_gh_pages:
    name: "${{ matrix.config.name }}: Build Docs & Upload"
    needs: [ get_version ]
    strategy:
      matrix:
        config:
          - name: ubuntu-24.04
            image: ubuntu-24.04
    runs-on: ${{ matrix.config.image }}
    timeout-minutes: 30
    steps:
      - name: Install Doxygen
        timeout-minutes: 10
        run: |
          mkdir dox
          cd dox
          wget --tries=3 --timeout=60 \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen-1.18.0.linux.bin.tar.gz" \
            | sha256sum -c -
          tar -xf doxygen-1.18.0.linux.bin.tar.gz
          cd doxygen-1.18.0
          sudo make
          sudo make install
          doxygen --version
          cd ..
          cd ..

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.get_version.outputs.tag_name}}

      - name: Check 0
        run: |
          ls

      - name: Check
        run: |
          ls ${{github.workspace}}

      # The README links to the samples and images by paths relative to the repository: in the docs, the samples point
      # to their sources of this release on GitHub, and the images are copied next to the main page.
      - name: Run Doxygen
        env:
          VERSION: ${{needs.get_version.outputs.version}}
        run: |
          cd "${{github.workspace}}"
          sed -i "s#](samples/#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${VERSION}/samples/#g" README.md
          cd docs
          doxygen ./Doxyfile
          mkdir -p html/docs
          cp -r images html/docs/
          cd ..

      - name: Pack
        run: |
          cd "${{github.workspace}}/docs/html"
          zip -r ../dxFeedGraalCxxApi-${{needs.get_version.outputs.version}}-Docs.zip .

      - name: Upload Docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-docs
          path: |
            ${{github.workspace}}/docs/*.zip

      - name: Upload docs as gh pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{github.workspace}}/docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  build_full_src_bundle_and_upload:
    name: "${{ matrix.config.name }}: Build Full Source Bundle & Upload"
    needs: [ get_version ]
    strategy:
      matrix:
        config:
          - name: win-vs2022
            image: windows-latest
    runs-on: ${{ matrix.config.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.get_version.outputs.tag_name}}

      #      - uses: mattnotmitt/doxygen-action@b84fe17600245bb5db3d6c247cc274ea98c15a3b # v1.12.0
      #        with:
      #          doxyfile-path: './docs/Doxyfile'
      #          working-directory: '${{github.workspace}}/docs'

      - name: Prepare build [Full Source Bundle]
        run: |
          ls
          mkdir ${{github.workspace}}/build-bundle

      - name: Build [Full Source Bundle]
        shell: pwsh
        run: |
          & "${{github.workspace}}/scripts/make-source-bundle.ps1" "${{needs.get_version.outputs.version}}"

      - name: Verify [Full Source Bundle][Offline]
        shell: pwsh
        run: |
          $bundleZips = @(Get-ChildItem -LiteralPath "${{github.workspace}}/build-bundle" -Filter "*-Full-Source-Bundle.zip")
          if ($bundleZips.Count -ne 1) {
              throw "Expected exactly one full source bundle, found $($bundleZips.Count)"
          }

          $verifySourceDir = Join-Path $env:RUNNER_TEMP "dxfcxx-source-bundle"
          $verifyBuildDir = Join-Path $env:RUNNER_TEMP "dxfcxx-source-bundle-build"
          New-Item -ItemType Directory -Path $verifySourceDir | Out-Null
          Expand-Archive -LiteralPath $bundleZips[0].FullName -DestinationPath $verifySourceDir

          $bundleRoots = @(Get-ChildItem -LiteralPath $verifySourceDir -Directory)
          if ($bundleRoots.Count -ne 1) {
              throw "Expected exactly one root directory in the source bundle, found $($bundleRoots.Count)"
          }

          cmake -S $bundleRoots[0].FullName -B $verifyBuildDir -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DDXFCXX_BUILD_DOC=OFF `
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build $verifyBuildDir --config Release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          ctest --test-dir $verifyBuildDir -C Release -R DXFeedTimeAndSalesStoreTest --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload [Full Source Bundle]
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-full-source-bundle-${{matrix.config.name}}
          path: |
            build-bundle/*.zip
          if-no-files-found: error

  # The -static-mt archives need no Visual C++ Redistributable: no DLL imports the dynamic C runtime, and the check
  # program linked in the two ways of the archive (.github/ci/static-mt-check) runs in a container without it.
  check_static_mt:
    name: "win-vs2022: Check the -static-mt archives"
    needs: [ get_version, build_package_and_upload ]
    # The container tag must match the host OS.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.get_version.outputs.tag_name}}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: static-mt
          pattern: artifacts-lib-win-vs2022-*-mt
          merge-multiple: true

      - name: Link the check program
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          mkdir unpacked
          for %%z in (static-mt\*-static-mt.zip) do tar -xf "%%z" -C unpacked || exit /b 1
          for %%t in (Release Debug RelWithDebInfo) do (
            for /d %%d in (unpacked\*-%%t-static-mt) do (
              call .github\ci\static-mt-check\check.cmd "%%d" check\%%t || exit /b 1
            )
            if not exist check\%%t\single\check.exe (
              echo FAIL: no %%t -static-mt archive
              exit /b 1
            )
          )

      - name: Run the check program on the host
        shell: pwsh
        run: |
          foreach ($type in 'Release', 'Debug', 'RelWithDebInfo') {
            ./.github/ci/static-mt-check/run.ps1 "check/$type"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Run the check program in Windows Server Core without the Redistributable
        shell: cmd
        run: >
          docker run --rm
          -v "${{github.workspace}}\check\Release:C:\check"
          -v "${{github.workspace}}\.github\ci\static-mt-check:C:\ci"
          mcr.microsoft.com/windows/servercore:ltsc2022
          powershell -NoProfile -ExecutionPolicy Bypass -Command
          "if (Test-Path C:\Windows\System32\vcruntime140.dll) { Write-Output 'FAIL: the image has the Redistributable'; exit 1 };
          & C:\ci\run.ps1 C:\check; if ($LASTEXITCODE -ne 0) { exit 1 }; exit 0"

  # The Linux packages load on the oldest systems they support: .github/ci/linux-packages-check/check.sh runs ldd on
  # every library and executable of the packages and starts a sample, in minimal images of those systems.
  check_linux_packages:
    name: "${{ matrix.config.name }}: Check the packages on ${{ matrix.system }}"
    needs: [ get_version, build_package_and_upload ]
    strategy:
      matrix:
        config:
          - name: oraclelinux-8-gcc-toolset-14
            image: ubuntu-24.04
          - name: oraclelinux-8-arm-gcc-toolset-14
            image: ubuntu-24.04-arm
        system: [ 'oraclelinux:8-slim', 'ubuntu:22.04' ]
    runs-on: ${{ matrix.config.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{needs.get_version.outputs.tag_name}}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages
          pattern: artifacts-*-${{ matrix.config.name }}-*
          merge-multiple: true

      - name: Unpack
        run: |
          # The Samples and Tools archives are in build-Samples/ and build-Tools/, as the build job uploads them. Without
          # nullglob, a missing archive leaves the pattern, and unzip or tar fails the step.
          mkdir unpacked
          for z in packages/*.zip; do unzip -q "$z" -d unpacked; done
          for t in packages/build-Samples/*.tar.gz packages/build-Tools/*.tar.gz; do
            tar -xzf "$t" -C unpacked
          done
          ls unpacked

      - name: Check
        run: >
          docker run --rm
          -v "${{github.workspace}}/unpacked:/packages:ro"
          -v "${{github.workspace}}/.github/ci/linux-packages-check:/ci:ro"
          ${{ matrix.system }}
          bash /ci/check.sh /packages

  publish_release:
    if: ${{ inputs.publish || contains(github.event_name, 'push')}}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Publish Release
    needs:
      - get_version
      - build_package_and_upload
      - build_full_src_bundle_and_upload
      - build_docs_and_upload_and_deploy_gh_pages
      - check_static_mt
      - check_linux_packages
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true
      - name: 'Echo download path'
        run: echo ${{steps.download.outputs.download-path}}

      - name: Display structure of downloaded files
        run: ls -R

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      - uses: softprops/action-gh-release@a4f117a9dd5572319a486154ec1147aebabd285c # untagged master commit of 2024-02-05
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/build-Samples/*.zip
            artifacts/build-Samples/*.tar.gz
            artifacts/build-Tools/*.zip
            artifacts/build-Tools/*.tar.gz
            artifacts/build-bundle/*.zip
          prerelease: >
            ${{ contains(needs.get_version.outputs.version, 'alpha')
            || contains(needs.get_version.outputs.version, 'beta') 
            || contains(needs.get_version.outputs.version, 'pre') 
            || contains(needs.get_version.outputs.version, 'rc') }}
          tag_name: ${{ needs.get_version.outputs.tag_name }}
          name: ${{ needs.get_version.outputs.version }}
          body_path: release-notes.md
          draft: ${{ contains(needs.get_version.outputs.version, 'draft') }}
          
