# The actions in .github/workflows are pinned by commit SHA; Dependabot proposes the updates (the SHA and the version
# comment) weekly: the minor and patch updates of all actions in one pull request, and every major update in a pull
# request of its own, so that a breaking major version can be checked and merged separately.
# Dependabot reads this file from the default branch only. Until v9 is released, the work goes to release/v9, so the
# pull requests target it; when release/v9 is merged into main, target-branch is removed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v9
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
