# The actions in .github/workflows are pinned by commit SHA; Dependabot proposes the updates (the SHA and the version
# comment) as one pull request per week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
