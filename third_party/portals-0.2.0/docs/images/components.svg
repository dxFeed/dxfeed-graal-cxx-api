<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-label="Components and shared data flow">
<title>Components and shared data flow</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365b78"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#183247}.title{font-size:26px;font-weight:bold}.label{font-size:18px;font-weight:bold}.detail{font-size:15px}.edge{fill:none;stroke:#365b78;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="680" fill="#f7f9fc"/>
<text x="36" y="42" class="title">Components and shared data flow</text>
<text x="36" y="74" class="detail">One UI runtime; scene-owned domain state; one rendering and output path.</text><rect x='36' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='140' text-anchor='middle' class='label'>Application</text><text x='196' y='167' text-anchor='middle' class='detail'>UI owner: one scheduler/tree/router</text><text x='196' y='190' text-anchor='middle' class='detail'>Single-use synchronous terminal run</text><path class='edge' d='M356,161 L384,161'/><rect x='390' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='140' text-anchor='middle' class='label'>Input and Scheduler</text><text x='550' y='167' text-anchor='middle' class='detail'>Owning CONTROL / immutable DATA</text><text x='550' y='190' text-anchor='middle' class='detail'>Bounded admission and dispatch</text><path class='edge' d='M710,161 L738,161'/><rect x='744' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='140' text-anchor='middle' class='label'>Scene and domain models</text><text x='904' y='167' text-anchor='middle' class='detail'>Bindings, providers, coherent pins</text><text x='904' y='190' text-anchor='middle' class='detail'>Explicit prepare/input/stop hooks</text><path class='edge' d='M904,212 V242 H196 V262'/><rect x='36' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='298' text-anchor='middle' class='label'>Tree, layout and styles</text><text x='196' y='325' text-anchor='middle' class='detail'>Checked nodes, geometry, invalidation</text><text x='196' y='348' text-anchor='middle' class='detail'>Controls / virtual views / Chart</text><path class='edge' d='M356,319 L384,319'/><rect x='390' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='298' text-anchor='middle' class='label'>Renderer and CellBuffer</text><text x='550' y='325' text-anchor='middle' class='detail'>Consume borrowed text in tree.frame</text><text x='550' y='348' text-anchor='middle' class='detail'>Own desired cells before frame ends</text><path class='edge' d='M710,319 L738,319'/><rect x='744' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='298' text-anchor='middle' class='label'>FrameWriter and terminal</text><text x='904' y='325' text-anchor='middle' class='detail'>Diff/encode, owned pending output</text><text x='904' y='348' text-anchor='middle' class='detail'>Commit only consistent acceptance</text><rect x='24' y='395' width='1052' height='148' rx='12' fill='none' stroke='#365b78' stroke-dasharray='6 5'/><text x='36' y='416' class='detail'>Optional causal metadata observations across the runtime and presentation flow</text><rect x='36' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='456' text-anchor='middle' class='label'>Diagnostics input token</text><text x='196' y='483' text-anchor='middle' class='detail'>Admission, queues, target and action</text><text x='196' y='506' text-anchor='middle' class='detail'>Optional bounded metadata</text><path class='edge' stroke-dasharray='5 4' d='M356,477 L384,477'/><rect x='390' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='456' text-anchor='middle' class='label'>Property and frame causes</text><text x='550' y='483' text-anchor='middle' class='detail'>Equality, commit, invalidation, frame ID</text><text x='550' y='506' text-anchor='middle' class='detail'>Coalesced causes stay observable</text><path class='edge' stroke-dasharray='5 4' d='M710,477 L738,477'/><rect x='744' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='456' text-anchor='middle' class='label'>Post-close export</text><text x='904' y='483' text-anchor='middle' class='detail'>Actual diff/flush and loss status</text><text x='904' y='506' text-anchor='middle' class='detail'>Application owns file I/O and errors</text><text x='36' y='620' class='detail'>Top two rows: runtime/presentation flow. Bottom row: causal observations of that same flow.</text><text x='36' y='648' class='detail'>Themes and charts use existing boundaries; no second dispatcher or hidden provider worker.</text></svg>
