<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-label="Ownership, borrows and orderly shutdown">
<title>Ownership, borrows and orderly shutdown</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365b78"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#183247}.title{font-size:26px;font-weight:bold}.label{font-size:18px;font-weight:bold}.detail{font-size:15px}.edge{fill:none;stroke:#365b78;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="680" fill="#f7f9fc"/>
<text x="36" y="42" class="title">Ownership, borrows and orderly shutdown</text>
<text x="36" y="74" class="detail">Arrows describe creation, retained-data flow and shutdown order; they are not owning pointers.</text><rect x='36' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='140' text-anchor='middle' class='label'>Caller creates Application</text><text x='196' y='167' text-anchor='middle' class='detail'>Owns scheduler, tree and router</text><text x='196' y='190' text-anchor='middle' class='detail'>Creating UI thread owns lifecycle</text><path class='edge' d='M356,161 L384,161'/><rect x='390' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='140' text-anchor='middle' class='label'>Caller creates scene next</text><text x='550' y='167' text-anchor='middle' class='detail'>Owns bindings, models and providers</text><text x='550' y='190' text-anchor='middle' class='detail'>Borrows Application through run</text><path class='edge' d='M710,161 L738,161'/><rect x='744' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='140' text-anchor='middle' class='label'>Run borrows terminal</text><text x='904' y='167' text-anchor='middle' class='detail'>Native owned session / custom borrow</text><text x='904' y='190' text-anchor='middle' class='detail'>Exclusive I/O until close</text><path class='edge' d='M904,212 V242 H196 V262'/><rect x='36' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='298' text-anchor='middle' class='label'>WidgetTree owns widgets</text><text x='196' y='325' text-anchor='middle' class='detail'>Node&lt;T&gt; observes identity only</text><text x='196' y='348' text-anchor='middle' class='detail'>read/edit borrows end at callback</text><path class='edge' d='M356,319 L384,319'/><rect x='390' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='298' text-anchor='middle' class='label'>Scene prepares immutable pins</text><text x='550' y='325' text-anchor='middle' class='detail'>Views retain snapshots and data</text><text x='550' y='348' text-anchor='middle' class='detail'>Payload destruction contract applies</text><path class='edge' d='M710,319 L738,319'/><rect x='744' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='298' text-anchor='middle' class='label'>Frame consumes text borrows</text><text x='904' y='325' text-anchor='middle' class='detail'>Owning CellBuffer goes to writer</text><text x='904' y='348' text-anchor='middle' class='detail'>Pending bytes stay owned</text><path class='edge' d='M904,370 V400 H196 V420'/><rect x='36' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='456' text-anchor='middle' class='label'>Stop scheduler first</text><text x='196' y='483' text-anchor='middle' class='detail'>Close queues; no future callbacks</text><text x='196' y='506' text-anchor='middle' class='detail'>Active callback is not unwound</text><path class='edge' d='M356,477 L384,477'/><rect x='390' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='456' text-anchor='middle' class='label'>scene.stop then terminal.close</text><text x='550' y='483' text-anchor='middle' class='detail'>Cancel/join scene-owned producers</text><text x='550' y='506' text-anchor='middle' class='detail'>Restore before errors/export</text><path class='edge' d='M710,477 L738,477'/><rect x='744' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='456' text-anchor='middle' class='label'>Destroy scene before app</text><text x='904' y='483' text-anchor='middle' class='detail'>Release bindings/models/providers</text><text x='904' y='506' text-anchor='middle' class='detail'>App releases router/tree/scheduler</text><text x='36' y='620' class='detail'>Model snapshots may outlive views; Node handles never prolong widget lifetime.</text><text x='36' y='648' class='detail'>No hard native close deadline; abrupt process termination is outside orderly restoration guarantees.</text></svg>
