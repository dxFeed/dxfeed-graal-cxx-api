<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-label="Input, model preparation and output">
<title>Input, model preparation and output</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#365b78"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#183247}.title{font-size:26px;font-weight:bold}.label{font-size:18px;font-weight:bold}.detail{font-size:15px}.edge{fill:none;stroke:#365b78;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1100" height="680" fill="#f7f9fc"/>
<text x="36" y="42" class="title">Input, model preparation and output</text>
<text x="36" y="74" class="detail">Preparation is outside the frame; terminal output is outside layout and paint.</text><rect x='36' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='140' text-anchor='middle' class='label'>Admit input</text><text x='196' y='167' text-anchor='middle' class='detail'>Decode POSIX / use native events</text><text x='196' y='190' text-anchor='middle' class='detail'>Retain rejected CONTROL owner</text><path class='edge' d='M356,161 L384,161'/><rect x='390' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='140' text-anchor='middle' class='label'>Dispatch once</text><text x='550' y='167' text-anchor='middle' class='detail'>scene.input then EventRouter</text><text x='550' y='190' text-anchor='middle' class='detail'>Focus / target / action / handler</text><path class='edge' d='M710,161 L738,161'/><rect x='744' y='110' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='140' text-anchor='middle' class='label'>Observe domain result</text><text x='904' y='167' text-anchor='middle' class='detail'>Property equality or commit</text><text x='904' y='190' text-anchor='middle' class='detail'>Changed value invalidates tree</text><path class='edge' d='M904,212 V242 H196 V262'/><rect x='36' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='298' text-anchor='middle' class='label'>Prepare when dirty and ready</text><text x='196' y='325' text-anchor='middle' class='detail'>Pin each model once; prepare siblings</text><text x='196' y='348' text-anchor='middle' class='detail'>Handle provider work outside paint</text><path class='edge' d='M356,319 L384,319'/><rect x='390' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='298' text-anchor='middle' class='label'>Build inside tree.frame</text><text x='550' y='325' text-anchor='middle' class='detail'>Layout and clipped borrowed paint</text><text x='550' y='348' text-anchor='middle' class='detail'>Consume into owning CellBuffer</text><path class='edge' d='M710,319 L738,319'/><rect x='744' y='268' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='298' text-anchor='middle' class='label'>Submit and flush</text><text x='904' y='325' text-anchor='middle' class='detail'>At most one each per cycle</text><text x='904' y='348' text-anchor='middle' class='detail'>Pending output blocks next frame</text><path class='edge' d='M904,370 V420'/><rect x='24' y='395' width='698' height='148' rx='12' fill='none' stroke='#365b78' stroke-dasharray='6 5'/><text x='36' y='416' class='detail'>Optional observations across the earlier stages</text><rect x='36' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='196' y='456' text-anchor='middle' class='label'>Trace causal stages</text><text x='196' y='483' text-anchor='middle' class='detail'>Input / queue / handler / Property</text><text x='196' y='506' text-anchor='middle' class='detail'>Handler return alone is insufficient</text><path class='edge' stroke-dasharray='5 4' d='M356,477 L384,477'/><rect x='390' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='550' y='456' text-anchor='middle' class='label'>Trace actual frame/output</text><text x='550' y='483' text-anchor='middle' class='detail'>Frame ID / diff_empty / output result</text><text x='550' y='506' text-anchor='middle' class='detail'>Acceptance does not prove display</text><rect x='744' y='426' width='320' height='102' rx='9' fill='#fff' stroke='#b4c7d8' stroke-width='2'/><text x='904' y='456' text-anchor='middle' class='label'>Cleanup then export</text><text x='904' y='483' text-anchor='middle' class='detail'>Scheduler stop; scene stop; close</text><text x='904' y='506' text-anchor='middle' class='detail'>First error plus restoration error</text><text x='36' y='620' class='detail'>EOF drains admitted CONTROL and submitted output; it does not wait for future repaint/timer/DATA.</text><text x='36' y='648' class='detail'>Trace rows show observations, not extra scheduling; missing/lost records leave incomplete chains.</text></svg>
